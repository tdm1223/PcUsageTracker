name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate tag version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tags must use stable vMAJOR.MINOR.PATCH syntax: $tag"
          }
          "RELEASE_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV

      - name: Test full solution
        run: dotnet test PcUsageTracker.sln -c Release -p:Version=${{ env.RELEASE_VERSION }}

      - name: Publish single-file
        run: >
          dotnet publish src/PcUsageTracker.App
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:Version=${{ env.RELEASE_VERSION }}
          -o publish

      - name: Rename artifact
        shell: pwsh
        run: |
          $src = "publish/PcUsageTracker.App.exe"
          $dst = "publish/PcUsageTracker-${{ github.ref_name }}-win-x64.exe"
          Move-Item -LiteralPath $src -Destination $dst

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/PcUsageTracker-${{ github.ref_name }}-win-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
